<meta charset="utf-8">
<title>Digital Stethoscope Block Diagram</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one technical sheet, figures full-width in scroll boxes, tables below each figure */
:root{
  --bg:#f4f6f7; --panel:#ffffff; --pcb:#e9f0ef; --fg:#18232b; --muted:#5b6a75; --line:#c5d0d6;
  --accent:#0b7a75; --w-pwr:#d0342c; --w-gnd:#2f3a47; --w-sig:#c98300; --tube:#8796a3;
  --warn-bg:#fff4e0; --warn-fg:#7a4a00;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1519; --panel:#172027; --pcb:#13262a; --fg:#e3eaee; --muted:#93a3ae; --line:#34444f;
  --accent:#3cc7bd; --w-pwr:#ff6b5e; --w-gnd:#b9c3cd; --w-sig:#ffc145; --tube:#6d7c88;
  --warn-bg:#2e2412; --warn-fg:#ffd28a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1519; --panel:#172027; --pcb:#13262a; --fg:#e3eaee; --muted:#93a3ae; --line:#34444f;
  --accent:#3cc7bd; --w-pwr:#ff6b5e; --w-gnd:#b9c3cd; --w-sig:#ffc145; --tube:#6d7c88;
  --warn-bg:#2e2412; --warn-fg:#ffd28a; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-block:32px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:40px}
header{display:grid;gap:6px}
.eyebrow{font:600 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(28px,4vw,40px);line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:22px;margin:0;text-wrap:balance}
h3{font-size:16px;margin:0}
p{margin:0;max-width:72ch}
.lede{color:var(--muted)}
section{display:grid;gap:16px;min-width:0}
figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;display:grid;min-width:0}
.scroll{overflow-x:auto;padding:12px}
.scroll svg{display:block;width:100%;height:auto}
.circuit svg{min-width:980px}
.blockd svg{min-width:820px}
figcaption{border-top:1px solid var(--line);padding:12px 16px;color:var(--muted);font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;padding:12px 16px;border-top:1px solid var(--line);font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.sw{width:28px;height:0;border-top:3px solid}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--pcb)}
tr:last-child td{border-bottom:0}
code,.m{font-family:var(--mono);font-size:.92em}
.chip{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
.grid2>*{min-width:0}
ol,ul{margin:0;padding-left:22px;display:grid;gap:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;display:grid;gap:10px}
.warn{background:var(--warn-bg);color:var(--warn-fg);border-color:transparent}
pre{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;overflow-x:auto;font:13px/1.55 var(--mono)}
@media print{
  @page{size:A4 landscape;margin:10mm}
  :root{padding:0}
  body{font-size:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .wrap{display:block;max-width:none;padding:0}
  .wrap>*+*{margin-top:16px}
  header{display:block}
  header>*+*{margin-top:4px}
  h1{font-size:28px}
  section{display:block;break-inside:avoid}
  section>*+*{margin-top:8px}
  .card{display:block}
  .card>*+*{margin-top:8px}
  figure{display:block}
  h2,h3{break-after:avoid}
  .scroll{overflow:visible;padding:4px}
  .circuit svg,.blockd svg{min-width:0;max-height:135mm}
  figcaption,.legend{padding:6px 12px;font-size:11px}
  figure,.card,pre,tr{break-inside:avoid}
}
/* SVG classes */
.t{fill:var(--fg);font-family:var(--sans)}
.tm{fill:var(--muted);font-family:var(--sans)}
.ta{fill:var(--accent);font-family:var(--sans)}
.tp{fill:var(--w-pwr);font-family:var(--sans)}
.tg{fill:var(--w-gnd);font-family:var(--sans)}
.ts{fill:var(--w-sig);font-family:var(--sans)}
.mono{font-family:var(--mono)}
.board{fill:var(--pcb);stroke:var(--line);stroke-width:1.5}
.box{fill:var(--panel);stroke:var(--muted);stroke-width:1.2}
.ghost{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4}
.pin{fill:var(--panel);stroke:var(--muted);stroke-width:1.2}
.pin-on{fill:var(--accent);stroke:var(--accent)}
.w{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.pwr{stroke:var(--w-pwr)} .gnd{stroke:var(--w-gnd)} .sig{stroke:var(--w-sig)}
.opt{stroke-dasharray:6 5}
.thin{fill:none;stroke:var(--muted);stroke-width:1.2}
.dot-s{fill:var(--w-sig)} .dot-g{fill:var(--w-gnd)}
.tube{fill:none;stroke:var(--tube);stroke-width:13;stroke-linecap:round;stroke-linejoin:round}
.tube-in{fill:none;stroke:var(--panel);stroke-width:5;stroke-linejoin:round}
.usb{fill:none;stroke:var(--muted);stroke-width:3.5;stroke-linejoin:round}
.fillm{fill:var(--muted)} .filla{fill:var(--accent)} .fillp{fill:var(--w-pwr)} .fillfg{fill:var(--fg)}
.grp{fill:none;stroke:var(--accent);stroke-width:1.3;stroke-dasharray:7 5}
.arr{fill:none;stroke:var(--fg);stroke-width:1.8}
.arrp{fill:none;stroke:var(--w-pwr);stroke-width:1.6;stroke-dasharray:5 4}
.arrm{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-dasharray:5 4}
</style>

<div class="wrap">
<header>
  <div class="eyebrow">FYP · ESP32 + MAX4466 · System overview</div>
  <h1>Digital Stethoscope: Block Diagram</h1>
  <p class="lede">How heart sound moves from the chest piece, through the acquisition hardware, to MATLAB processing on the laptop.</p>
</header><!-- ============ FIGURE 2: BLOCK DIAGRAM ============ -->
<section>
  
  <figure class="blockd">
    <div class="scroll">
<svg viewBox="0 0 1020 400" role="img" aria-label="Block diagram: chest piece to microphone amplifier to ESP32 ADC, then over USB serial to the laptop, where MATLAB filters, detects S1 and S2, measures heart rate and timing, and displays the results. The laptop powers the ESP32, which powers the microphone.">
  <defs>
    <marker id="b-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fillfg"/></marker>
    <marker id="b-ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fillp"/></marker>
    <marker id="b-ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fillm"/></marker>
  </defs>

  <!-- groups -->
  <rect x="15" y="58" width="730" height="130" rx="10" class="grp"/>
  <text x="27" y="48" class="ta mono" font-size="11" font-weight="600" letter-spacing="1.5">HARDWARE · SENSING AND ACQUISITION</text>
  <rect x="15" y="250" width="990" height="128" rx="10" class="grp"/>
  <text x="27" y="240" class="ta mono" font-size="11" font-weight="600" letter-spacing="1.5">LAPTOP · MATLAB PROCESSING</text>

  <!-- row 1 -->
  <rect x="30" y="85" width="180" height="76" rx="6" class="box"/>
  <text x="120" y="119" text-anchor="middle" class="t" font-size="14" font-weight="600">Stethoscope</text>
  <text x="120" y="139" text-anchor="middle" class="tm" font-size="11">chest piece + tube</text>
  <rect x="290" y="85" width="180" height="76" rx="6" class="box"/>
  <text x="380" y="119" text-anchor="middle" class="t" font-size="14" font-weight="600">Microphone + amplifier</text>
  <text x="380" y="139" text-anchor="middle" class="tm" font-size="11">GY‑MAX4466</text>
  <rect x="550" y="85" width="180" height="76" rx="6" class="box"/>
  <text x="640" y="119" text-anchor="middle" class="t" font-size="14" font-weight="600">ESP32</text>
  <text x="640" y="139" text-anchor="middle" class="tm" font-size="11">ADC sampling ≈4 kHz</text>

  <line x1="210" y1="112" x2="288" y2="112" class="arr" marker-end="url(#b-ah)"/>
  <text x="250" y="104" text-anchor="middle" class="t" font-size="10">heart sound</text>
  <line x1="470" y1="112" x2="548" y2="112" class="arr" marker-end="url(#b-ah)"/>
  <text x="510" y="104" text-anchor="middle" class="t" font-size="10">audio signal</text>
  <line x1="550" y1="142" x2="472" y2="142" class="arrp" marker-end="url(#b-ahp)"/>
  <text x="510" y="157" text-anchor="middle" class="tp" font-size="10">3.3 V power</text>

  <!-- ESP32 to laptop -->
  <path d="M730 112 H900 V278" class="arr" marker-end="url(#b-ah)"/>
  <text x="815" y="104" text-anchor="middle" class="t" font-size="10">USB serial (samples)</text>
  <line x1="640" y1="250" x2="640" y2="163" class="arrp" marker-end="url(#b-ahp)"/>
  <text x="650" y="215" class="tp" font-size="10">5 V USB power</text>

  <!-- row 2 (flows right to left) -->
  <rect x="810" y="280" width="180" height="76" rx="6" class="box"/>
  <text x="900" y="314" text-anchor="middle" class="t" font-size="14" font-weight="600">Band‑pass filter</text>
  <text x="900" y="334" text-anchor="middle" class="tm" font-size="11">20–500 Hz Butterworth</text>
  <rect x="550" y="280" width="180" height="76" rx="6" class="box"/>
  <text x="640" y="314" text-anchor="middle" class="t" font-size="14" font-weight="600">S1 / S2 detection</text>
  <text x="640" y="334" text-anchor="middle" class="tm" font-size="11">envelope → beat times</text>
  <rect x="290" y="280" width="180" height="76" rx="6" class="box"/>
  <text x="380" y="314" text-anchor="middle" class="t" font-size="14" font-weight="600">Heart rate &amp; timing</text>
  <text x="380" y="334" text-anchor="middle" class="tm" font-size="11">BPM · S1–S2 · S2–S1</text>
  <rect x="30" y="280" width="180" height="76" rx="6" class="box"/>
  <text x="120" y="314" text-anchor="middle" class="t" font-size="14" font-weight="600">Display &amp; record</text>
  <text x="120" y="334" text-anchor="middle" class="tm" font-size="11">waveform · BPM · timing</text>

  <line x1="810" y1="318" x2="732" y2="318" class="arr" marker-end="url(#b-ah)"/>
  <text x="770" y="310" text-anchor="middle" class="t" font-size="10">clean signal</text>
  <line x1="550" y1="318" x2="472" y2="318" class="arr" marker-end="url(#b-ah)"/>
  <text x="510" y="310" text-anchor="middle" class="t" font-size="10">beat times</text>
  <line x1="290" y1="318" x2="212" y2="318" class="arr" marker-end="url(#b-ah)"/>
  <text x="250" y="310" text-anchor="middle" class="t" font-size="10">measurements</text>

</svg>
    </div>
    <div class="legend">
      <span><i class="sw" style="border-color:var(--fg)"></i>Signal / data flow</span>
      <span><i class="sw" style="border-color:var(--w-pwr);border-top-style:dashed"></i>Power</span>
    </div>
    <figcaption>Sound travels through the hardware row left to right, crosses to the laptop over USB, then moves through the MATLAB stages right to left until results are shown. Power runs the other way: laptop to ESP32 to microphone.</figcaption>
  </figure>
</section>

</div>
